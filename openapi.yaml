{'openapi': '3.1.0', 'info': {'title': 'AI Chatbot Backend', 'description': '\nMulti-provider AI chatbot API with stateful session support, stateless workflow mode,\nand SQL analytics mode (controlled via the `mode` field on chat requests).\n\n## Authentication\nNo authentication is required. API keys are server-side only.\n\n## Rate Limiting\nChat endpoints are rate-limited per client IP. Exceeding the limit returns **429**\nwith a `Retry-After` header indicating when the client may retry.\n\n## Request Tracing\nEvery response includes an `x-request-id` header (server-generated UUID hex).\nInclude this value when reporting errors.\n\n## Server-Sent Events (SSE)\nStreaming endpoints return `text/event-stream`. Each event has the shape:\n```\nevent: <event-type>\ndata: <JSON object>\n```\nSee individual endpoint descriptions for the event types they emit.\n', 'version': '1.0.0'}, 'servers': [{'url': 'http://localhost:8000', 'description': 'Local development'}], 'paths': {'/v1/chat': {'post': {'summary': 'Chat', 'operationId': 'chat_v1_chat_post', 'requestBody': {'content': {'application/json': {'schema': {'oneOf': [{'$ref': '#/components/schemas/SessionChatRequest'}, {'$ref': '#/components/schemas/WorkflowChatRequest'}], 'title': 'Payload', 'discriminator': {'propertyName': 'mode', 'mapping': {'session': '#/components/schemas/SessionChatRequest', 'stateless': '#/components/schemas/WorkflowChatRequest', 'analytics': '#/components/schemas/WorkflowChatRequest'}}}}}, 'required': True}, 'responses': {'200': {'description': 'Successful Response', 'content': {'application/json': {'schema': {'anyOf': [{'$ref': '#/components/schemas/ChatResponse'}, {'$ref': '#/components/schemas/WorkflowResponse'}], 'title': 'Response Chat V1 Chat Post'}}}}, '400': {'description': 'Bad Request', 'content': {'application/json': {'schema': {'$ref': '#/components/schemas/ErrorResponse'}}}}, '429': {'description': 'Too Many Requests', 'content': {'application/json': {'schema': {'$ref': '#/compone